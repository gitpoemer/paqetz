[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "x86_64-unknown-linux-musl" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One cipher suite, no agility (D1). A second AEAD in the tree means something
# pulled in an alternative — a design regression, so fail rather than let it
# land quietly. `ring` is deliberately *not* banned: it is a live candidate for
# the ChaCha20-Poly1305 implementation on performance grounds (§8.11), and
# adopting it means extending the license allow-list above.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "aes-gcm" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
