name: release

# Builds the executables for a tag and attaches them to its release.
#
# Linux only. That is not laziness: the datapath is built on AF_PACKET,
# IP_HDRINCL and TUN, so there is no such thing as a Windows or macOS build to
# produce.
#
# Both musl and glibc are published. The musl builds are static and drop onto
# any box regardless of its glibc, which is what makes them the safe default for
# an old VPS; the glibc builds are smaller, link against the system's own
# libraries, and are what a distribution package would look like. Publishing
# both means nobody has to discover which one their host needs.
#
# No packages. A single file to copy is the whole delivery.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Nothing is published from a tree that would not pass. This is the only gate
  # in the repository, so it carries everything: formatting, lints, tests, docs,
  # and the dependency audit.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Docs
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Advisories, licences, and the ban list -- which is what holds the
  # single-cipher-suite decision in place. Worth keeping precisely because a
  # second AEAD arriving through a transitive feature is exactly how `ring` got
  # into this tree unnoticed.
  audit:
    name: audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  version:
    name: read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: read
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "paqetz") | .version')

          # A tag that disagrees with Cargo.toml produces a release whose
          # `--version` contradicts its own filename, which is the sort of thing
          # nobody notices until they are trying to work out which build is on a
          # box. Catch it here instead.
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the crate version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [verify, audit, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, and the safe choice on a host whose glibc is unknown.
          - target: x86_64-unknown-linux-musl
            cross: false
            static: true
          - target: aarch64-unknown-linux-musl
            cross: true
            static: true
          # Small boxes and single-board machines.
          - target: armv7-unknown-linux-musleabihf
            cross: true
            static: true
          # Rare, but the hardware exists and the build costs nothing.
          - target: riscv64gc-unknown-linux-musl
            cross: true
            static: true
          # For a 32-bit x86 host, which is now unusual enough that anyone on
          # one will not find a build anywhere else.
          - target: i686-unknown-linux-musl
            cross: true
            static: true
          # Dynamically linked against the host's own libraries.
          - target: x86_64-unknown-linux-gnu
            cross: false
            static: false
          - target: aarch64-unknown-linux-gnu
            cross: true
            static: false
            platform: linux/arm64
            image: debian:stable-slim
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: ${{ !matrix.cross && matrix.static }}
        run: sudo apt-get -y update && sudo apt-get -y install musl-tools

      - uses: taiki-e/install-action@v2
        if: ${{ matrix.cross }}
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          cmd=cargo
          [ "${{ matrix.cross }}" = "true" ] && cmd=cross
          # Only the binary. The library crates are an implementation detail
          # and there is nothing to ship from them.
          "$cmd" build --locked --release --bin paqetz --target ${{ matrix.target }}

      - name: Name and check it
        id: artifact
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/paqetz"
          # No version in the name, deliberately. GitHub only serves
          # `releases/latest/download/<name>` for a name that does not change
          # between releases, and that stable URL is what makes a one-line
          # install possible. The version is in the release itself, and in
          # `paqetz --version`.
          name="paqetz-${{ matrix.target }}"
          mkdir -p dist
          cp "$src" "dist/$name"
          chmod +x "dist/$name"

          file "dist/$name"

          # A musl build that quietly acquired a dynamic dependency still runs
          # here and fails only on the target machine, which is the worst place
          # to find out. Check rather than assume.
          if [ "${{ matrix.static }}" = "true" ] \
             && file "dist/$name" | grep -q "dynamically linked"; then
            echo "::error::${{ matrix.target }} was meant to be static but is not"
            exit 1
          fi

          ( cd dist && sha256sum "$name" > "$name.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Compiling is not the same as running, and for every target but this
      # runner's own the two had never been checked apart. Registering qemu's
      # binfmt handlers lets a foreign binary run here, which is how a 32-bit or
      # endianness mistake gets caught before someone finds it on a router.
      #
      # What runs is the artifact itself, not a rebuild. An earlier version of
      # this used `cross run`, which quietly ate the `--version` argument and
      # launched the binary with none: clap printed its help and exited 2, and
      # every emulated target failed. Running `dist/$NAME` has no such ambiguity
      # and has the better property anyway of testing the exact file we upload.
      #
      # keygen is the useful thing to run: it exercises the curve and the
      # generator, needs no privilege, and fails loudly if either is wrong.
      - name: Register qemu
        if: ${{ matrix.cross }}
        uses: docker/setup-qemu-action@v3

      - name: Smoke test (native)
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          NAME: ${{ steps.artifact.outputs.name }}
        run: |
          "./dist/$NAME" --version
          "./dist/$NAME" keygen > /dev/null

      # Static, so it needs nothing but the kernel's binfmt handler and runs
      # straight from the host.
      - name: Smoke test (emulated, static)
        if: ${{ matrix.cross && matrix.static }}
        shell: bash
        env:
          NAME: ${{ steps.artifact.outputs.name }}
        run: |
          "./dist/$NAME" --version
          "./dist/$NAME" keygen > /dev/null

      # Dynamically linked, so it needs its target's libc and runs inside an
      # image of that architecture rather than on the runner.
      - name: Smoke test (emulated, dynamic)
        if: ${{ matrix.cross && !matrix.static }}
        shell: bash
        env:
          NAME: ${{ steps.artifact.outputs.name }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/dist:/dist:ro" -e NAME "${{ matrix.image }}" \
            sh -c '"/dist/$NAME" --version && "/dist/$NAME" keygen > /dev/null'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          # One list covering every binary, so a user can verify the whole
          # release with `sha256sum -c`. We refuse to install an unverified
          # Xray; publishing our own sums is the same courtesy.
          ( cd dist && cat *.sha256 | sort -k2 > SHA256SUMS && rm -f *.sha256 )
          ls -l dist
          cat dist/SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          # The tag may not have a release yet when this was triggered by a
          # plain tag push.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        shell: bash
        run: |
          {
            echo "### paqetz ${{ needs.version.outputs.tag }}"
            echo
            echo 'Statically linked, Linux only. Verify with:'
            echo
            echo '```'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo '```'
            echo
            echo '| file | sha256 |'
            echo '| --- | --- |'
            awk '{printf "| %s | `%s` |\n", $2, $1}' dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
