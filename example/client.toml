# The side that initiates. It needs to know where the server is; the server does
# not need to know where it is.

[interface]
private_key = "REPLACE-WITH-YOUR-PRIVATE-KEY"
address = "10.7.0.2/24"

# No listen_port: the outer port is ephemeral, chosen at start-up. Nothing needs
# to reach this end at a fixed address.

[peer]
public_key = "REPLACE-WITH-THE-SERVER-PUBLIC-KEY"
endpoint = "203.0.113.5:9999"
tunnel_address = "10.7.0.1"

# --- Everything below is optional. The defaults are what you want. ---

# Which operating system the carrier should resemble on the wire. Affects TTL,
# MSS, window scale, window, and whether TCP timestamps are negotiated.
# One of: linux-6 (default), windows-11, android-14.
#profile = "linux-6"

# Whether the carrier performs a synthetic TCP handshake. "midstream" (default)
# never emits a SYN, which is how paqet behaves and keeps the responder from
# answering anything it cannot authenticate. See docs/decisions/D14.
#carrier = "midstream"

# Inner MTU. The default leaves room for the outer IPv4, TCP, TCP options, and
# the tunnel's own framing against a 1500-byte path.
#mtu = 1400

# Name of the TUN device.
#device = "paqetz0"

# How packets move between the device and the wire.
#   "simple"  (default) — one packet per syscall.
#   "batched"           — up to 32 per syscall, drained from what is already
#                         queued. Measured at +6-8% on UDP packet rate but
#                         -2-7% on TCP throughput, which is a difference near
#                         the noise floor; the cipher dominates, so amortising
#                         the syscall has little left to win. Re-measure with
#                         scripts/bench.sh on your own path before switching.
#datapath = "simple"

# Which mechanism puts frames on the wire.
#   "raw"      (default) — raw socket with IP_HDRINCL. The kernel routes and
#                          resolves the next hop, so there is no hardware
#                          address to go stale when a gateway fails over.
#   "afpacket"           — names the next hop itself, skipping the route lookup
#                          and the netfilter OUTPUT chain. Consistently ~5-10%
#                          faster, but it needs the next hop's hardware address,
#                          which goes stale if a gateway fails over. Needs a
#                          peer endpoint to resolve that hop, so the waiting
#                          side falls back to "raw" and says so.
#transmit = "raw"

# Whether to install and remove the kernel firewall rules automatically. These
# stop the kernel resetting the flow, so turning this off means applying the
# output of `paqetz firewall plan` yourself.
#manage_firewall = true

# What to do about a hop that cannot carry a full-sized packet.
#
#   "never" (default) — set Don't Fragment, and read the ICMP reports that come
#                       back. A hop too small answers with the MTU it can take;
#                       that is counted as `too-big` in the health line and
#                       announced once with the value to lower `mtu` to.
#                       Nothing is applied automatically -- the message is
#                       unauthenticated, and an MTU the network can set is a
#                       lever worth being slow about.
#   "path"            — clear it, and cap the MTU so no hop should need to
#                       fragment. Nothing here reassembles: the capture socket
#                       sees fragments before the kernel joins them, and the
#                       filter passes only the first. The cap is what makes
#                       clearing the bit safe, so an `mtu` above it is
#                       lowered to it, with a line in the log saying so.
#                       Should a hop fragment anyway the pieces are dropped and
#                       counted as `unparsed`, so the failure is a counter that
#                       moves rather than silence.
#
# `too-big` in the health line means full-sized packets are being dropped out on
# the path. It reads as ordinary loss from both ends, which is why it is counted
# apart -- this one is fixed by lowering `mtu`.
#fragment = "never"

# --- Moving the outer five-tuple ---
#
# On by default, and the initiating side only: the side that waits has to be
# findable, so it keeps its configured port.
#
# A five-tuple that lives for hours and carries gigabytes stops working. What
# that looks like from here is throughput collapsing with no loss at all, or the
# flow going silent altogether -- packets keep leaving and nothing comes back --
# and a restart curing it, because a restart is a new source port. Moving on a
# timer is the same cure without the outage.
#
# The defaults below are what one censored path wanted when it was measured.
# They are guesses about someone else's timers, so they are settings.
#rotate = true

# Seconds one port is kept, before jitter, and the random spread either side of
# it. Jitter defaults to a third of the interval and must stay under it; 0 gives
# a fixed period, which is itself a pattern.
#rotate_after = 900
#rotate_jitter = 300

# How many ports to move between, 2 to 64. The pool is also what a blocked port
# is escaped into, so it decides how long one rests before being tried again:
# ports x rotate_after. The capture filter and the firewall rules are both
# generated from this at start-up, so there is nothing to keep in step by hand.
#rotate_ports = 20

# How many unanswered handshakes mean the five-tuple itself is the problem
# rather than the peer. Each attempt is about five seconds, so the default gives
# up on a port after roughly twenty. Lower recovers faster and will sometimes
# move away from a port that was merely unlucky on a lossy path.
#rotate_after_unanswered = 4

# --- Optional SOCKS5 front end (debugging) ---
#
# Off unless this section is present. It lets one program be pointed at the
# tunnel without touching the routing table -- useful for `curl` and for a
# proxy-aware application, while the rest of the host carries on as normal.
#
# No userspace TCP stack is involved: connections are ordinary kernel sockets
# with SO_MARK set, and a policy route steers marked traffic into the tunnel.
# paqetz installs and removes that route itself.
#
# This is the one place in the design that holds per-flow state, which is why it
# is opt-in and described as a debugging convenience rather than the way to run
# this. L3 -- routing traffic through the device -- is the production path.
#
#[socks5]
#listen = "127.0.0.1:1080"
#mark = 0x51        # firewall mark stamped on outbound connections
#table = 51         # routing table the policy rule points at
#username = "..."   # optional; both or neither
#password = "..."

# --- Diagnostics ---

# How much to say on stdout: off, error, warn, info (default), debug.
# `PAQETZ_LOG=debug` overrides this for one run without editing the file, and
# `kill -HUP` re-reads it on a running tunnel without dropping the session.
#
# Per-packet events are never logged individually -- they are counted, and
# reported in the health line below. Logging one line per rejected packet would
# let whoever is sending garbage at the port decide how much this process writes.
#log = "info"

# Seconds between health lines; 0 disables them. Each line reports uptime, how
# long ago the last handshake completed, traffic each way, and any counter that
# is non-zero:
#
#   up 3h12m | handshake 47s ago | tx 1.2M pkt/1.60 GB | rx 1.1M pkt/1.50 GB
#
# rx flat means nothing is arriving -- firewall or routing. rejected climbing
# with rx flat means packets arrive and fail to authenticate -- a key mismatch,
# or a scanner. ring-drops climbing means the capture buffer is too small.
#health_interval = 60

# --- Sending only some traffic through the tunnel ---
#
# `route_all = true` captures everything this host sends. That is wrong when a
# proxy runs in front of the tunnel: it would capture the replies the proxy owes
# its own users and send them into the tunnel instead.
#
# Instead, have the proxy mark its outbound sockets and route only those. Xray
# does this with `streamSettings.sockopt.mark`. Nothing is proxied by paqetz and
# no per-flow state exists anywhere -- the kernel routes.
#
#route_marked = 81   # sockets with this firewall mark use the tunnel
#route_table = 51    # the routing table the rule points at
#
# For a program that cannot set a socket mark, use the [socks5] listener below
# instead. See docs/09-deployment.md for which to choose.
